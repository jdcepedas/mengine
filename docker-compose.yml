# Local containerized deployment.
# Build: ./gradlew :mengine-core:installDist :gateway:bootJar && docker-compose build
# Run:   docker-compose up
#
# Single-partition (default): gateway + me-core (stream 10).
# Two-partition: gateway uses GW_ME_CORE_URLS and GW_AERON_STREAM_IDS; me-core-0 (stream 10), me-core-1 (stream 11).
# Startup: Gateway first (owns Media Driver in shared volume), then ME Core(s) connect.
# Use a subdirectory (/dev/shm/aeron/driver) so the driver can delete/recreate it.

version: "3.8"

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      GW_HTTP_PORT: "8080"
      GW_AERON_CHANNEL: "aeron:ipc"
      GW_AERON_STREAM_ID: "10"
      GW_AERON_DIR: "/dev/shm/aeron/driver"
      GW_ME_CORE_URL: "http://me-core:8081"
      GW_ME_CORE_URLS: "http://me-core:8081,http://me-core-1:8082"
      GW_AERON_STREAM_IDS: "10,11"
      GW_SYMBOLS: "AAPL,MSFT"
      GW_DB_URL: "jdbc:postgresql://db:5432/mengine"
      GW_DB_USER: mengine
      GW_DB_PASSWORD: mengine
    volumes:
      - aeron-shared:/dev/shm/aeron
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/orderbook/AAPL || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  me-core:
    build:
      context: .
      dockerfile: mengine-core/Dockerfile
    ports:
      - "8081:8081"
    environment:
      ME_QUERY_PORT: "8081"
      ME_AERON_CHANNEL: "aeron:ipc"
      ME_AERON_STREAM_ID: "10"
      ME_AERON_DIR: "/dev/shm/aeron/driver"
      ME_JOURNAL_DIR: "/data/journal"
      ME_DB_URL: "jdbc:postgresql://db:5432/mengine"
      ME_DB_USER: mengine
      ME_DB_PASSWORD: mengine
      ME_LATENCY_LOG_ENABLED: true
    volumes:
      - aeron-shared:/dev/shm/aeron
      - journal-data:/data/journal
    depends_on:
      db:
        condition: service_healthy

  me-core-1:
    build:
      context: .
      dockerfile: mengine-core/Dockerfile
    ports:
      - "8082:8082"
    environment:
      ME_QUERY_PORT: "8082"
      ME_AERON_CHANNEL: "aeron:ipc"
      ME_AERON_STREAM_ID: "11"
      ME_AERON_DIR: "/dev/shm/aeron/driver"
      ME_JOURNAL_DIR: "/data/journal"
      ME_DB_URL: "jdbc:postgresql://db:5432/mengine"
      ME_DB_USER: mengine
      ME_DB_PASSWORD: mengine
      ME_LATENCY_LOG_ENABLED: true
    volumes:
      - aeron-shared:/dev/shm/aeron
      - journal-data-1:/data/journal
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      POSTGRES_DB: mengine
      POSTGRES_USER: mengine
      POSTGRES_PASSWORD: mengine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  aeron-shared:
  journal-data:
  journal-data-1:
  pgdata:
