# Local containerized deployment.
# Build: ./gradlew :mengine-core:installDist :gateway:bootJar && docker-compose build
# Run:   docker-compose up
#
# Startup order: Gateway first (owns Media Driver in shared volume), then ME Core (connects).
# Gateway healthcheck ensures the driver is up before ME Core starts.
# Use a subdirectory (/dev/shm/aeron/driver) so the driver can delete/recreate it; the volume mount at /dev/shm/aeron must not be deleted.

version: "3.8"

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      GW_HTTP_PORT: "8080"
      GW_AERON_CHANNEL: "aeron:ipc"
      GW_AERON_STREAM_ID: "10"
      GW_AERON_DIR: "/dev/shm/aeron/driver"
      GW_ME_CORE_URL: "http://me-core:8081"
      GW_DB_URL: "jdbc:postgresql://db:5432/mengine"
      GW_DB_USER: mengine
      GW_DB_PASSWORD: mengine
    volumes:
      - aeron-shared:/dev/shm/aeron
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/orderbook/AAPL || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  me-core:
    build:
      context: .
      dockerfile: mengine-core/Dockerfile
    ports:
      - "8081:8081"
    environment:
      ME_QUERY_PORT: "8081"
      ME_AERON_CHANNEL: "aeron:ipc"
      ME_AERON_STREAM_ID: "10"
      ME_AERON_DIR: "/dev/shm/aeron/driver"
      ME_JOURNAL_DIR: "/data/journal"
      ME_DB_URL: "jdbc:postgresql://db:5432/mengine"
      ME_DB_USER: mengine
      ME_DB_PASSWORD: mengine
    volumes:
      - aeron-shared:/dev/shm/aeron
      - journal-data:/data/journal

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mengine
      POSTGRES_USER: mengine
      POSTGRES_PASSWORD: mengine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  aeron-shared:
  journal-data:
  pgdata:
