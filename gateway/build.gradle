plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

application {
    mainClass = 'com.mengine.gateway.GatewayApplication'
    applicationDefaultJvmArgs = [
        '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED',
        '--add-opens=java.base/jdk.internal.reflect=ALL-UNNAMED'
    ]
}

dependencies {
    implementation project(':mengine-shared')
    implementation 'io.aeron:aeron-client:1.48.6'
    implementation 'io.aeron:aeron-driver:1.48.6'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.postgresql:postgresql:42.6.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

bootJar {
    archiveBaseName = 'gateway'
}

// Agrona/Aeron need access to JDK internals on Java 17+. Apply to ALL JavaExec tasks
// so IntelliJ "Run GatewayApplication.main()" (which uses a Gradle JavaExec) gets these too.
tasks.withType(JavaExec).configureEach {
    jvmArgs(
        '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED',
        '--add-opens=java.base/jdk.internal.reflect=ALL-UNNAMED'
    )
}

test {
    useJUnitPlatform()
}
